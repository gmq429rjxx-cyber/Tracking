:root{
  --bg:#F3F3F5; --surface:#FFFFFF; --surface-2:#EAEAEE; --fg:#1A1A1E; --muted:#5C5C67; --line:#DDDDE3;
  --accent:#1A1A1E; --accent-fg:#FFFFFF; --accent-soft:#E6E6EB;
  --ok:#1F7A4D; --ok-soft:#DFF1E6; --warn:#8A5A00; --warn-soft:#F6EAD0; --bad:#B4371A; --bad-soft:#F8E0D8;
  --scrim:rgba(12,12,16,.44); --viewer:#000; --shadow:0 1px 2px rgba(16,16,24,.05),0 10px 30px rgba(16,16,24,.07);
  --c0:#2E7C6A; --c1:#BF522B; --c2:#3B60B5; --c3:#934AAB; --c4:#A87A08; --c5:#2C8A3D; --c6:#BE3866; --c7:#5A6977; --c8:#C9731A; --c9:#1C8A9B;
  --c10:#26457F; --c11:#5A7ED0; --c12:#4D6F96; --c13:#5E8E26; --c14:#1F6B4F; --c15:#2F9C80; --c16:#A8362A; --c17:#6046B5; --c18:#A84FC4; --c19:#8A7556;
  --f-display:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0C0E; --surface:#17171A; --surface-2:#232327; --fg:#ECECF0; --muted:#B3B3BC; --line:#2D2D33;
  --accent:#F2F2F5; --accent-fg:#121215; --accent-soft:#2B2B31;

  --c0:#5BC2A9; --c1:#EE8A62; --c2:#7F9FEA; --c3:#C68ADB; --c4:#D9B04A; --c5:#6CC57B; --c6:#EE7CA2; --c7:#9AA9B6; --c8:#EEA45B; --c9:#5CC6D5;
  --c10:#5577D6; --c11:#A9C0F6; --c12:#86A6CC; --c13:#A8CF6C; --c14:#4FB08A; --c15:#86DCC5; --c16:#F2735C; --c17:#A28CF2; --c18:#DFA2F2; --c19:#C8B594;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C0C0E; --surface:#17171A; --surface-2:#232327; --fg:#ECECF0; --muted:#B3B3BC; --line:#2D2D33;
  --accent:#F2F2F5; --accent-fg:#121215; --accent-soft:#2B2B31;
  --ok:#5FC48C; --ok-soft:#15301F; --warn:#E3AA4A; --warn-soft:#33270F; --bad:#F07B57; --bad-soft:#3A1C13;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --c0:#5BC2A9; --c1:#EE8A62; --c2:#7F9FEA; --c3:#C68ADB; --c4:#D9B04A; --c5:#6CC57B; --c6:#EE7CA2; --c7:#9AA9B6; --c8:#EEA45B; --c9:#5CC6D5;
  --c10:#5577D6; --c11:#A9C0F6; --c12:#86A6CC; --c13:#A8CF6C; --c14:#4FB08A; --c15:#86DCC5; --c16:#F2735C; --c17:#A28CF2; --c18:#DFA2F2; --c19:#C8B594;
  color-scheme:dark }
:root[data-accent="blau"]{--accent:#2F5FD0; --accent-fg:#FFFFFF; --accent-soft:#E2E9FB}
@media (prefers-color-scheme: dark){ :root[data-accent="blau"]:not([data-theme="light"]){--accent:#8AACF3; --accent-fg:#0B1730; --accent-soft:#1C2943}}
:root[data-theme="dark"][data-accent="blau"]{--accent:#8AACF3; --accent-fg:#0B1730; --accent-soft:#1C2943}
:root[data-accent="petrol"]{--accent:#0D6B5B; --accent-fg:#FFFFFF; --accent-soft:#D6EBE5}

@media (prefers-color-scheme: dark){ :root[data-accent="pflaume"]:not([data-theme="light"]){--accent:#D49BD1; --accent-fg:#2A0F29; --accent-soft:#33202F}}
:root[data-theme="dark"][data-accent="pflaume"]{--accent:#D49BD1; --accent-fg:#2A0F29; --accent-soft:#33202F}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.amt{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.banner{border-radius:var(--r-md);padding:10px 14px;font-size:13.5px;background:var(--warn-soft);color:var(--fg);display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--warn)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.015em;text-wrap:balance}
.navpair{display:flex;gap:6px}
.hero{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv strong{display:block;font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--ok)} .neg{color:var(--fg)} .badtxt{color:var(--bad)} .muted{color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.meter-head b{color:var(--fg);font-weight:600}
.bar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);overflow:visible}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);max-width:100%}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.bar>em{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--fg);opacity:.55}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actions .btn{padding:0 8px;font-size:14px;gap:6px}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.irow.two{grid-template-columns:minmax(0,1fr) auto}
.irow.stack{grid-template-columns:minmax(0,1fr)}
.irow.stack select,.irow.stack .row-main{grid-column:1/-1;max-width:none!important}
.irow:first-child{border-top:0}
.irow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.irow select{grid-column:2/-1;min-height:40px;font-size:15px}
.irow.off{opacity:.5}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
ol.steps code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:13px;word-break:break-all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
section.block{display:flex;flex-direction:column;gap:10px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.block-head h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em}
.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.list>.row:first-child,.list>.dayhead+.row{border-top:0}
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line)}.list>.dayhead+.swipe{border-top:0}
.swipe>.row{position:relative;z-index:1;border-top:0;background:var(--surface);transition:transform .22s ease;touch-action:pan-y}
.swipe.drag>.row{transition:none}
.swipe-act{position:absolute;inset:0 0 0 auto;display:flex}
.swipe-act button{border:0;color:#fff;font-weight:600;font-size:14px;padding:0 18px;min-width:84px;cursor:pointer}
.swipe-act .del{background:var(--bad)}.swipe-act .settle{background:var(--ok)}
.badge{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row-amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.row .cardglyph{width:34px;height:23px;border-radius:5px;flex:0 0 auto}
.row-end{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.row-date{font-size:12px;color:var(--muted);white-space:nowrap}
.badge svg{width:19px;height:19px}
.amount-wrap{position:relative}
.amount-wrap .input.amount{padding-left:44px}
.amount-wrap b{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--muted);pointer-events:none}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:var(--r-md);padding:8px 8px 8px 14px;font-size:13.5px}
.nowrap{white-space:nowrap}
.row-amt.pos{color:var(--ok)}
.clip{width:14px;height:14px;vertical-align:-2px;color:var(--muted)}
.dayhead{display:flex;justify-content:space-between;padding:10px 14px 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
.empty{padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--fg);font-size:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--surface-2);color:var(--muted)}
.brow{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.list>.brow:first-child{border-top:0}
.brow-top{display:flex;align-items:center;gap:10px}
.brow-top .row-main{flex:1}
.brow-nums{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.brow-nums b{color:var(--fg);font-weight:600}
.cards-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.minicard{flex:0 0 auto;width:150px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.minicard .ct{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;min-width:0}
.minicard .ct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minicard .amt{font-family:var(--f-display);font-weight:700;font-size:20px}
.cardglyph{width:26px;height:18px;border-radius:4px;background:var(--c);flex:none;position:relative}
.cardglyph::after{content:"";position:absolute;left:4px;top:5px;width:7px;height:5px;border-radius:1px;background:var(--surface);opacity:.75}
.cardtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.cardtile-head{display:flex;align-items:center;gap:12px}
.cardtile-head .cardglyph{width:42px;height:28px;border-radius:6px}
.cardtile-head .cardglyph::after{left:6px;top:8px;width:10px;height:8px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.facts div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts strong{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;flex-direction:column;gap:8px}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field>label>span,details.more>summary{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;min-height:46px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.input.amount{font-family:var(--f-display);font-weight:700;font-size:30px;min-height:60px;font-variant-numeric:tabular-nums}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label,.seg button{min-height:38px;display:grid;place-items:center;padding:0 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);border:0;background:none}
.seg input:checked+label,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:1}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:15px;font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks .chip{flex:none;min-width:52px;justify-content:center}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:10px}
.verdict strong{font-family:var(--f-display);font-size:18px}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs img{height:110px;width:auto;border-radius:10px;border:1px solid var(--line);flex:none}
.receipt-img{max-height:240px;width:auto;border-radius:10px;border:1px solid var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.status{display:flex;gap:12px;align-items:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{stroke-width:2.3}
.looksw{display:block;width:14px;height:14px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px var(--line)}

const defaultProfile = () => ({v:1, cards:[], categories:JSON.parse(JSON.stringify(DEFAULT_CATS)), budgets:{}, totalBudget:null, exampleBudgetKeys:[], walletMap:{}, recurring:[], bankMap:{}, ibanMap:{}, merchantAlias:{}, createdAt:new Date().toISOString()});
function normalizeProfile(p){
  const o = JSON.parse(JSON.stringify(p || {}));
  if (!Array.isArray(o.categories) || !o.categories.length) o.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
  if (!Array.isArray(o.cards)) o.cards = [];
  if (!o.budgets || typeof o.budgets !== 'object') o.budgets = {};
  if (!Array.isArray(o.exampleBudgetKeys)) o.exampleBudgetKeys = [];
  if (!o.walletMap || typeof o.walletMap !== 'object') o.walletMap = {};
  if (!Array.isArray(o.recurring)) o.recurring = [];
  for (const k of ['bankMap', 'ibanMap', 'merchantAlias']) if (!o[k] || typeof o[k] !== 'object') o[k] = {};
  if (o.totalBudget === undefined) o.totalBudget = null;
  return o;
}

const cats = () => S.profile.categories;
const catById = id => cats().find(c => c.id === id) || {id, name:'Ohne Kategorie', color:7, kind:'expense'};
const cardById = id => S.profile.cards.find(c => c.id === id);
const allEntries = () => [...S.entries.values()];
const entriesIn = prefix => allEntries().filter(e => typeof e.date === 'string' && e.date.startsWith(prefix));
/* Spar-Kategorien (Investment, Rücklage) zählen nicht als Ausgabe, sondern als gespart */
const isSaving = id => !!(cats().find(c => c.id === id) || {}).saving;
function sums(list){ let inc = 0, exp = 0, sav = 0; for (const e of list) { if (e.type === 'income') inc += e.amount || 0; else if (e.type === 'expense') { if (isSaving(e.catId)) sav += e.amount || 0; else exp += e.amount || 0; } } return {inc, exp, sav, bal:inc - exp - sav}; }
function spentByCat(list){ const m = {}; for (const e of list) if (e.type === 'expense') m[e.catId] = (m[e.catId] || 0) + (e.amount || 0); return m; }
function paceOf(k){ const t = today(); if (mkey(t) === k) return parseISO(t).getDate() / dim(k); return k < mkey(t) ? 1 : 0; }
/* Ampel: über 100 % = überschritten; ab 85 % = knapp; ab dem 10. Tag zusätzlich knapp, wenn der Verbrauch 20 Punkte vor dem Kalender liegt (Fixkosten am Monatsanfang lösen so keinen Fehlalarm aus) */
function budgetState(spent, budget, pace){ if (!budget) return null; const r = spent / budget; if (r > 1) return 'bad'; if (r >= 0.85 || (pace >= 0.33 && pace < 1 && r > pace + 0.2)) return 'warn'; return 'ok'; }
const STATE_TXT = {ok:'im Rahmen', warn:'knapp', bad:'überschritten', done:'bezahlt', open:'offen'};
/* Fixe Kosten werden einmal im Monat fällig – Tempo-Vergleich wäre falsch */
function isFixedCat(c){ return /fix/i.test(c.group || '') || S.profile.recurring.some(r => r.catId === c.id && r.type === 'expense' && isActive(r)); }
function catState(c, spent, budget, pace){ if (!budget) return null; if (!isFixedCat(c)) return budgetState(spent, budget, pace); if (spent > budget * 1.02) return 'bad'; return spent >= budget * 0.9 ? 'done' : 'open'; }
/* Ohne eigenes Gesamtbudget zählen nur Ausgaben in Kategorien mit Budget, sonst wäre der Vergleich schief */
/* Basis fürs Tagesbudget: mit Fixkosten-Gruppe nur variable Kategorien, sonst Gesamtbudget minus noch fällige Daueraufträge */
function dailyBase(k){
  const exp = cats().filter(c => c.kind === 'expense' && !c.saving && S.profile.budgets[c.id]);
  if (!S.profile.totalBudget && exp.some(isFixedCat)) {
    const ids = new Set(exp.filter(c => !isFixedCat(c)).map(c => c.id));
    return {budget:exp.filter(c => ids.has(c.id)).reduce((a, c) => a + S.profile.budgets[c.id], 0), due:0, hint:' · ohne Fixkosten',
      spent:l => l.reduce((a, e) => a + (e.type === 'expense' && ids.has(e.catId) ? e.amount : 0), 0)};
  }
  const t = today(), end = k + '-' + String(dim(k)).padStart(2, '0'); let due = 0;
  for (const r of S.profile.recurring) if (isActive(r) && r.type === 'expense' && !isSaving(r.catId) && (S.profile.totalBudget || S.profile.budgets[r.catId])) due += occurrences(r, addDays(t, 1), end).length * r.amount;
  return {budget:totalBudget(), due, spent:budgetSpent, hint:due ? ' · ' + money0(due) + ' Fixkosten noch fällig' : ''};
}
function budgetSpent(list){ if (S.profile.totalBudget) return sums(list).exp; const sp = spentByCat(list); let t = 0; for (const c of cats()) if (c.kind === 'expense' && !c.saving && S.profile.budgets[c.id]) t += sp[c.id] || 0; return t; }
function totalBudget(){ if (S.profile.totalBudget) return S.profile.totalBudget; let t = 0; for (const c of cats()) if (c.kind === 'expense' && !c.saving && S.profile.budgets[c.id]) t += S.profile.budgets[c.id]; return t || 0; }
function billingPeriod(card, refISO){
  const d = parseISO(refISO || today()); const cd = card.closingDay;
  const clamp = (y, m) => Math.min(cd, new Date(y, m + 1, 0).getDate());
  let endY = d.getFullYear(), endM = d.getMonth();
  if (d.getDate() > clamp(endY, endM)) { endM += 1; if (endM > 11) { endM = 0; endY++; } }
  const end = new Date(endY, endM, clamp(endY, endM));
  let sY = endY, sM = endM - 1; if (sM < 0) { sM = 11; sY--; }
  const start = new Date(sY, sM, clamp(sY, sM) + 1);
  return {from:isoOf(start), to:isoOf(end)};
}
/* Anzeige-Stand: Konto/Bar = Guthaben, Kreditkarte = offener Betrag */
function cardStatus(cd){
  const bal = cardBalance(cd); if (bal == null) return {known:false};
  if (cd.kind === 'credit') return bal <= 0 ? {known:true, label:'offen', v:-bal, raw:bal, bad:bal < 0} : {known:true, label:'Guthaben', v:bal, raw:bal};
  return {known:true, label:'Stand', v:bal, raw:bal, bad:bal < 0};
}
function cardBalance(card){
  if (card.startBalance == null) return null;
  let b = card.startBalance;
  const from = card.startDate || '';
  for (const e of allEntries()) {
    /* Stichtag: Buchungen davor stecken im Stand; am Stichtag selbst zählen nur die nach dem Eintragen erfassten */
    if (from && (e.date < from || (e.date === from && card.startAt && (e.createdAt || '') <= card.startAt))) continue;
    if (e.type === 'transfer') { if (e.cardId === card.id) b -= e.amount; if (e.toCardId === card.id) b += e.amount; }
    else if (e.cardId === card.id) b += e.type === 'income' ? e.amount : -e.amount;
  }
  return b;
}

/* ---------- persistence: IndexedDB, nur auf diesem Gerät ---------- */
const clean = o => JSON.parse(JSON.stringify(o));
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('kassabuch', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('entries', {keyPath:'id'}); d.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = idb.transaction(store, mode); let out;
    const st = Array.isArray(store) ? store.map(n => t.objectStore(n)) : t.objectStore(store);
    out = fn(st);
    t.oncomplete = () => res(out && 'result' in out ? out.result : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => { s.put(v, k); });
function writeErr(e){
  if (e && e.name === 'QuotaExceededError') return 'Speicher am Gerät voll. Alte Belegfotos löschen oder Backup machen.';
  return 'Speichern fehlgeschlagen. App neu öffnen und erneut versuchen.';
}
function saveProfile(next){
  S.profile = normalizeProfile(next); render();
  return kvSet('profile', clean(S.profile)).catch(e => toast(writeErr(e)));
}
async function saveEntry(e){
  e.updatedAt = new Date().toISOString();
  if (!e.createdAt) e.createdAt = e.updatedAt;
  S.entries.set(e.id, e); render();
  await tx('entries', 'readwrite', s => { s.put(clean(e)); });
}
async function putEntries(list){ for (const e of list) S.entries.set(e.id, e); await tx('entries', 'readwrite', s => { for (const e of list) s.put(clean(e)); }); render(); }
async function deleteEntries(ids){
  const blobIds = [];
  for (const id of ids) { const e = S.entries.get(id); if (e && e.receipts) for (const r of e.receipts) if (r.blobId) blobIds.push(r.blobId); S.entries.delete(id); }
  render();
  await tx(['entries', 'blobs'], 'readwrite', ([es, bs]) => { for (const id of ids) es.delete(id); for (const b of blobIds) bs.delete(b); });
}
const deleteEntry = id => deleteEntries([id]);
async function saveSettings(){ await kvSet('settings', clean(SET)); S.canScan = !!SET.apiKey; }
const blobUrls = new Map();
async function blobUrl(id){
  if (blobUrls.has(id)) return blobUrls.get(id);
  const b = await tx('blobs', 'readonly', s => s.get(id));
  if (!b) return '';
  const u = URL.createObjectURL(b); blobUrls.set(id, u); return u;
}
function hydrateBlobs(root){ root.querySelectorAll('a[data-blob-link]').forEach(async a => { const u = await blobUrl(a.dataset.blobLink); if (u) a.href = u; }); root.querySelectorAll('img[data-blob]').forEach(async img => { const u = await blobUrl(img.dataset.blob); if (u) img.src = u; else img.replaceWith(Object.assign(document.createElement('span'), {className:'note', textContent:'Foto nicht mehr vorhanden'})); }); }

function loadExamplesInto(profile){
  const ex = makeExamples();
  const p = clean(profile);
  for (const c of ex.cards) if (!p.cards.some(x => x.id === c.id)) p.cards.push(c);
  for (const [k, v] of Object.entries(ex.budgets)) if (!p.budgets[k]) { p.budgets[k] = v; if (!p.exampleBudgetKeys.includes(k)) p.exampleBudgetKeys.push(k); }
  if (!Array.isArray(p.recurring)) p.recurring = [];
  for (const r of ex.recurring) if (!p.recurring.some(x => x.id === r.id)) p.recurring.push(r);
  return {p, entries:ex.entries};
}

/* Händler kurz wie im Alltag: "Lidl Österreich GmbH, Filiale Musterort" -> "Lidl" */
const CHAINS = ['Lidl', 'Hofer', 'Billa Plus', 'Billa', 'Interspar', 'Eurospar', 'Spar', 'Penny', 'MPreis', 'Unimarkt', 'Nah&Frisch', 'Merkur', 'dm', 'Bipa', 'Müller', 'Rossmann', 'OMV', 'BP', 'Shell', 'Eni', 'Jet', 'Turmöl', 'Avanti', 'Ikea', 'XXXLutz', 'Möbelix', 'Hornbach', 'Obi', 'Bauhaus', 'Lagerhaus', "McDonald's", 'Burger King', 'Amazon', 'H&M', 'Zara', 'C&A', 'Deichmann', 'Thalia', 'MediaMarkt', 'Hartlauer', 'Fressnapf', 'Action', 'Tedi', 'Kik', 'Pagro', 'Libro', 'Intersport', 'Decathlon', 'Kastner & Öhler'];
const CHAIN_RX = CHAINS.map(n => [n, new RegExp('^' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace("'", "['’]?").replace(' ', '\\s*') + '(?![\\p{L}\\d])', 'iu')]);
function shortMerchant(m){
  const raw = String(m || '').trim(); if (!raw) return '';
  for (const [n, rx] of CHAIN_RX) if (rx.test(raw)) return n;
  let t = raw.replace(/[,;\s]+(Filiale|Fil\.|Markt\s*Nr|Standort|Niederlassung|Zweigstelle)\b.*$/iu, '')
    .replace(/(?<![\p{L}])(Ges\.?\s?m\.?\s?b\.?\s?H\.?|GesmbH|GmbH(\s*&\s*Co\.?\s*KG)?|AG|KG|OG|e\.\s?U\.|Warenhandels[\p{L}-]*|Handels[\p{L}-]*|Österreich|Austria)(?![\p{L}])/giu, '')
    .replace(/\s{2,}/g, ' ').replace(/^[\s,;–-]+|[\s,;–-]+$/g, '');
  return t.length >= 2 ? t.slice(0, 60) : raw.slice(0, 60);
}

/* ---------- Daueraufträge ---------- */
const FREQ = {monthly:'monatlich', quarterly:'vierteljährlich', yearly:'jährlich', weekly:'wöchentlich'};
const FREQ_PER_MONTH = {monthly:1, quarterly:1 / 3, yearly:1 / 12, weekly:52 / 12};
function occurrences(r, fromISO, toISO){
  const out = [];
  if (!validISO(r.startDate)) return out;
  const from = fromISO > r.startDate ? fromISO : r.startDate;
  const end = r.endDate && r.endDate < toISO ? r.endDate : toISO;
  if (from > end) return out;
  if (r.freq === 'weekly') {
    let d = r.startDate;
    const skip = Math.max(0, Math.floor(dayDiff(from, d) / 7));
    d = addDays(d, skip * 7);
    for (let i = 0; i < 600 && d <= end; i++, d = addDays(d, 7)) if (d >= from) out.push(d);
    return out;
  }
  const step = r.freq === 'yearly' ? 12 : r.freq === 'quarterly' ? 3 : 1;
  const day = r.day || parseISO(r.startDate).getDate();
  for (let i = 0; i < 1200; i++) {
    const k = addMonths(mkey(r.startDate), i * step), d = k + '-' + pad(Math.min(day, dim(k)));
    if (d > end) break;
    if (d >= from) out.push(d);
  }
  return out;
}
const isActive = r => r.active !== false && !(r.endDate && r.endDate < today());
const nextDue = r => isActive(r) ? (occurrences(r, addDays(today(), 1), addDays(today(), 400))[0] || null) : null;
function relDays(iso){ const n = dayDiff(iso, today()); return n === 0 ? 'heute' : n === 1 ? 'morgen' : n < 0 ? 'vor ' + (-n) + ' Tagen' : 'in ' + n + ' Tagen'; }
function entryFromRule(r, d){

const MON = new Intl.DateTimeFormat('de-AT', {month:'short', year:'numeric'});

  // comparison
  let cmp = '';
  if (!year) {
    const prev = addMonths(S.month, -1), isCur = S.month === mkey(today());
    const cut = isCur ? parseISO(today()).getDate() : 31;
    const pe = sums(entriesIn(prev).filter(e => parseISO(e.date).getDate() <= cut)).exp;
    if (pe) { const ch = (s.exp - pe) / pe * 100; cmp = '<em class="' + (ch > 2 ? 'badtxt' : ch < -2 ? 'pos' : 'muted') + '">' + (ch > 0 ? '+' : '') + Math.round(ch) + ' % zum Vormonat' + (isCur ? ' (bis zum ' + cut + '.)' : '') + '</em>'; }
  } else {
    const pe = sums(entriesIn(String(S.statsYear - 1))).exp;
    if (pe) { const ch = (s.exp - pe) / pe * 100; cmp = '<em class="' + (ch > 2 ? 'badtxt' : ch < -2 ? 'pos' : 'muted') + '">' + (ch > 0 ? '+' : '') + Math.round(ch) + ' % zu ' + (S.statsYear - 1) + '</em>'; }
  }
  const days = year ? (S.statsYear === new Date().getFullYear() ? Math.ceil((new Date() - new Date(S.statsYear, 0, 1)) / 864e5) : 365) : (S.month === mkey(today()) ? parseISO(today()).getDate() : dim(S.month));

  if (biggest) h += '<div class="panel" style="flex-direction:row;align-items:center;gap:12px">' + badge(catById(biggest.catId)) + '<div class="row-main"><span class="row-sub">Größte Einzelausgabe</span><span class="row-title">' + esc(biggest.merchant || catById(biggest.catId).name) + ' · ' + money(biggest.amount) + '</span></div></div>';

  if (!year && list.length) h += '<button class="btn" data-act="review" data-k="' + esc(S.month) + '">Monatsrückblick ' + esc(monthLabel(S.month).split(' ')[0]) + '</button>';
  if (!year) h += curveSection();
  // trend chart
  const keys = [];
  if (year) for (let m = 1; m <= 12; m++) keys.push(S.statsYear + '-' + pad(m));
  else for (let i = 5; i >= 0; i--) keys.push(addMonths(S.month, -i));
  const series = keys.map(kk => sums(entriesIn(kk)));
  const max = niceMax(Math.max(1, ...series.map(x => Math.max(x.inc, x.exp))) / 100) * 100;
  const W = 340, H = 180, L = 46, R = 6, T = 10, B = 24, cw = (W - L - R) / keys.length, bw = Math.min(16, cw * 0.32);

  for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = T + (H - T - B) * (1 - i / 4); svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + esc(money0(v).replace('€', '').trim()) + '</text>'; }
  keys.forEach((kk, i) => {

    svg += '<rect x="' + (x + 1) + '" y="' + (base - he) + '" width="' + bw + '" height="' + Math.max(0, he) + '" rx="3" fill="var(--bad)" opacity="' + (sel || year ? 1 : 0.55) + '"><title>' + esc(monthLabel(kk)) + ' Ausgaben ' + esc(money(sx.exp)) + '</title></rect>';
    svg += '<text x="' + x + '" y="' + (H - 7) + '" text-anchor="middle" font-size="10.5" fill="' + (sel ? 'var(--fg)' : 'var(--muted)') + '" font-weight="' + (sel ? 700 : 500) + '">' + esc(MON_S.format(parseISO(kk + '-01')).replace('.', '')) + '</text>';

  h += cr.length ? '<div class="hbars">' + cr.map(([id, v]) => { const c = catById(id); return '<div class="hbar" style="--c:var(--c' + (c.color % 20) + ')"><span class="lab"><i class="dot"></i><span>' + esc(c.name) + '</span></span><span class="num"><b>' + money(v) + '</b> <span class="muted">' + Math.round(v / s.exp * 100) + ' %</span></span><span class="track"><i style="width:' + (v / cr[0][1] * 100) + '%"></i></span></div>'; }).join('') + '</div>' : '<div class="list"><div class="empty">Keine Ausgaben in diesem Zeitraum.</div></div>';
  h += '</section>';

  // cards

    const rows = S.profile.cards.map(cd => ({cd, v:sums(list.filter(e => e.cardId === cd.id)).exp})).filter(r => r.v).sort((a, b) => b.v - a.v);
    const none = sums(list.filter(e => !e.cardId)).exp;
    if (rows.length || none) {
      const mx = Math.max(none, ...rows.map(r => r.v));
      h += '<section class="block"><div class="block-head"><h2>Nach Karte</h2></div><div class="hbars">' + rows.map(r => '<div class="hbar" style="--c:var(--c' + (r.cd.color % 20) + ')"><span class="lab"><i class="dot"></i><span>' + esc(r.cd.name) + '</span></span><span class="num"><b>' + money(r.v) + '</b></span><span class="track"><i style="width:' + (r.v / mx * 100) + '%"></i></span></div>').join('') + (none ? '<div class="hbar" style="--c:var(--c7)"><span class="lab"><i class="dot"></i><span>Ohne Karte</span></span><span class="num"><b>' + money(none) + '</b></span><span class="track"><i style="width:' + (none / mx * 100) + '%"></i></span></div>' : '') + '</div></section>';
    }
  }
  // merchants
  const mm = {};
  for (const e of list) if (e.type === 'expense' && e.merchant) { const key = e.merchant.trim(); mm[key] = mm[key] || {n:0, v:0}; mm[key].n++; mm[key].v += e.amount; }
  const top = Object.entries(mm).sort((a, b) => b[1].v - a[1].v).slice(0, 6);
  if (top.length) h += '<section class="block"><div class="block-head"><h2>Wo das Geld hingeht</h2></div><div class="list">' + top.map(([m, o]) => '<div class="row"><span class="row-main"><span class="row-title">' + esc(m) + '</span><span class="row-sub">' + o.n + (o.n === 1 ? ' Buchung' : ' Buchungen') + '</span></span><span class="row-amt">' + money(o.v) + '</span></div>').join('') + '</div></section>';
  return h + '</div>';
}

function merchantIndex(){

    const img = new Image(); img.src = url; await img.decode();
    const max = 1800, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
    const cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);

}

  if (cardMatch.how === 'last4') out.push(['ok', 'Karte erkannt: ' + cardById(cardMatch.id).name + '.']);
  else if (cardMatch.how === 'unknown') out.push(['warn', 'Karte •••• ' + cardMatch.l4 + ' ist nicht angelegt. Bitte Karte wählen.']);

async function deliverFile(filename, data, mime){
  const file = new File([data], filename, {type:mime});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file]}); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return true;
}

        const bCats = new Set(batch.map(e => e.catId)), bCards = new Set(batch.flatMap(e => [e.cardId, e.toCardId]).filter(Boolean));
        const rich = c => !!(c.last4 || c.ibanLast4 || Object.values(p2.bankMap).includes(c.id) || Object.values(p2.ibanMap).includes(c.id));
        const nc = p2.categories.length, nk = p2.cards.length;
        p2.categories = p2.categories.filter(c => !(c.id.startsWith('k-') && bCats.has(c.id) && !usedCat.has(c.id) && !p2.budgets[c.id] && !c.group));
        p2.cards = p2.cards.filter(c => !(bCards.has(c.id) && !usedCard.has(c.id) && !rich(c) && c.startBalance == null));
        const rm = (nc - p2.categories.length) + (nk - p2.cards.length);
        await fin(rm ? p2 : null, null, [...gone], l.length + ' gelöscht, ' + (batch.length - l.length) + ' behalten');
      });
    });
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  let delim = ';', best = -1;
  for (const c of [';', ',', '\t']) { const n = first.split(c).length; if (n > best) { best = n; delim = c; } }
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(field); field = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else field += ch;
  }
  row.push(field); if (row.some(x => x.trim() !== '')) rows.push(row);
  return {delim, rows};
}
function parseDateAny(s){
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  if ((m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + pad(m[2]) + '-' + pad(m[1]); }
  return null;
}
async function readText(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch (_) { return new TextDecoder('windows-1252').decode(buf); }
}
async function onCsvFile(file){
  let parsed;
  try { parsed = parseCSV(await readText(file)); } catch (_) { toast('Datei konnte nicht gelesen werden.'); return; }
  const rows = parsed.rows;
  if (rows.length < 2) { toast('Keine Datenzeilen gefunden.'); return; }
  const head = rows[0].map(h => h.trim());
  const guess = re => head.findIndex(h => re.test(h));
  const map = {date:guess(/datum|date|tag/i), amount:guess(/betrag|amount|summe|wert|preis/i), cat:guess(/kategorie|category|gruppe/i), note:guess(/notiz|beschreibung|text|note|titel|bemerk|verwendung/i), card:guess(/konto|account|karte|zahlungs|wallet/i), type:guess(/^typ|^art$|type|einnahme.?\/?.?ausgabe/i), merchant:guess(/händler|haendler|empfänger|payee|merchant|partner/i)};
  const opts = h => '<option value="-1">— nicht verwenden —</option>' + head.map((x, i) => '<option value="' + i + '">' + esc(x || ('Spalte ' + (i + 1))) + '</option>').join('');
  const sel = (id, label, key) => '<label class="field"><span>' + label + '</span><select class="input" id="' + id + '">' + opts() + '</select></label>';
  openSheet('CSV importieren',
    '<p class="note" style="margin:0">' + esc(file.name) + ' · ' + (rows.length - 1) + ' Zeilen. Ordne die Spalten zu, prüfe die Vorschau und importiere.</p>' +
    '<div class="formgrid">' + sel('m-date', 'Datum *') + sel('m-amount', 'Betrag *') + sel('m-cat', 'Kategorie') + sel('m-card', 'Karte / Konto') + sel('m-merchant', 'Händler') + sel('m-note', 'Notiz') + sel('m-type', 'Typ (Einnahme/Ausgabe)') +
    '<label class="field"><span>Positive Beträge sind</span><select class="input" id="m-pos"><option value="expense">Ausgaben</option><option value="income">Einnahmen</option></select></label></div>' +
    '<div id="m-preview"></div><p class="note" id="m-err" role="alert" hidden></p><div class="progress" id="m-prog" hidden><i></i></div><button class="btn primary" id="m-go">Importieren</button>',
    root => {
      const ids = {date:'m-date', amount:'m-amount', cat:'m-cat', card:'m-card', merchant:'m-merchant', note:'m-note', type:'m-type'};
      for (const [k, id] of Object.entries(ids)) $('#' + id, root).value = String(map[k]);
      if (map.type < 0) $('#m-pos', root).value = 'income';
      const read = () => { const o = {}; for (const [k, id] of Object.entries(ids)) o[k] = Number($('#' + id, root).value); o.pos = $('#m-pos', root).value; return o; };
      const build = (mp, row) => {
        const g = i => i >= 0 ? String(row[i] || '').trim() : '';
        const date = parseDateAny(g(mp.date)); const n = num(g(mp.amount));
        if (!date || n == null || n === 0) return null;
        let type;
        const tv = g(mp.type).toLowerCase();
        if (tv && /ein|income|gutschrift|haben/.test(tv)) type = 'income';
        else if (tv && /aus|expense|soll|belast/.test(tv)) type = 'expense';
        else type = n < 0 ? (mp.pos === 'income' ? 'expense' : 'income') : mp.pos;
        return {date, amount:Math.round(Math.abs(n) * 100), type, catName:g(mp.cat), cardName:g(mp.card), merchant:g(mp.merchant), note:g(mp.note)};
      };
      const preview = () => {
        const mp = read(); const sample5 = rows.slice(1, 6).map(r => build(mp, r));
        const ok = rows.slice(1).map(r => build(mp, r)).filter(Boolean).length;
        $('#m-preview', root).innerHTML = '<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Typ</th><th class="r">Betrag</th><th>Kategorie</th><th>Karte</th></tr></thead><tbody>' + sample5.map(x => x ? '<tr><td>' + esc(x.date) + '</td><td>' + (x.type === 'income' ? 'Einnahme' : 'Ausgabe') + '</td><td class="r">' + money(x.amount) + '</td><td>' + esc(x.catName || 'Sonstiges') + '</td><td>' + esc(x.cardName || '–') + '</td></tr>' : '<tr><td colspan="5" class="muted">Zeile nicht lesbar</td></tr>').join('') + '</tbody></table></div><p class="note" style="margin:6px 0 0">' + ok + ' von ' + (rows.length - 1) + ' Zeilen lesbar.</p>';
      };
      root.querySelectorAll('select').forEach(s => s.addEventListener('change', preview)); preview();
      $('#m-go', root).onclick = async () => {
        const mp = read(), err = $('#m-err', root);
        if (mp.date < 0 || mp.amount < 0) { err.hidden = false; err.textContent = 'Datum und Betrag müssen zugeordnet sein.'; return; }
        const parsedRows = rows.slice(1).map(r => build(mp, r)).filter(Boolean);
        if (!parsedRows.length) { err.hidden = false; err.textContent = 'Keine Zeile lesbar. Spaltenzuordnung prüfen.'; return; }
        const p = clean(S.profile);
        const catFor = (name, type) => {
          const nm = name || (type === 'income' ? 'Sonstige Einnahmen' : 'Sonstiges');
          let c = p.categories.find(x => x.kind === type && x.name.toLowerCase() === nm.toLowerCase());
          if (!c) { c = {id:'k-' + newId(), name:nm, color:p.categories.length % 20, kind:type}; p.categories.push(c); }
          return c.id;
        };
        const cardFor = name => {
          if (!name) return '';
          let c = p.cards.find(x => x.name.toLowerCase() === name.toLowerCase());
          if (!c) { c = {id:newId(), name, kind:/bar|cash/i.test(name) ? 'cash' : 'debit', color:p.cards.length % 20, last4:'', closingDay:null, startBalance:null}; p.cards.push(c); }
          return c.id;
        };
        const seen = new Set(allEntries().map(e => [e.date, e.amount, e.type, (e.note || '') + (e.merchant || '')].join('|')));
        const todo = [], batch = 'csv-' + newId();
        for (const x of parsedRows) {
          const key = [x.date, x.amount, x.type, x.note + x.merchant].join('|');
          if (seen.has(key)) continue; seen.add(key);
          todo.push({id:newId() + todo.length, type:x.type, amount:x.amount, date:x.date, catId:catFor(x.catName, x.type), cardId:cardFor(x.cardName), merchant:x.merchant, note:x.note, imported:true, importBatch:batch, createdAt:new Date().toISOString()});
        }
        const skipped = parsedRows.length - todo.length;
        if (!todo.length) { err.hidden = false; err.textContent = 'Alle Zeilen sind schon vorhanden.'; return; }
        $('#m-go', root).disabled = true; err.hidden = true;
        await saveProfile(p);
        const prog = $('#m-prog', root), bar = prog.querySelector('i'); prog.hidden = false;
        let done = 0, failed = 0;
        try { await putEntries(todo); done = todo.length; bar.style.width = '100%'; } catch (x) { failed = todo.length; }
        render(); closeSheet();
        toast(done + ' importiert' + (skipped ? ', ' + skipped + ' doppelt übersprungen' : '') + (failed ? ', ' + failed + ' fehlgeschlagen' : '') + '.');
      };
    });
}

function openRepeat(){

  }

(function gestures(){
  let sx = 0, sy = 0, mode = null, row = null, wrap = null, open = null, lpTimer = 0, lpFired = false;
  const closeOpen = () => { if (open) { open.querySelector('.row').style.transform = ''; open.querySelectorAll('[data-sure]').forEach(b => { delete b.dataset.sure; b.textContent = 'Löschen'; }); open = null; } };
  document.addEventListener('touchstart', ev => {
    const t0 = ev.touches[0]; sx = t0.clientX; sy = t0.clientY; mode = null; lpFired = false;
    const add = ev.target.closest('.tab-add');
    if (add) { lpTimer = setTimeout(() => { lpFired = true; if (navigator.vibrate) try { navigator.vibrate(10); } catch (_) {} openRepeat(); }, 480); return; }
    wrap = ev.target.closest('#eList .swipe'); row = wrap ? wrap.querySelector('.row') : null;
    if (open && (!wrap || wrap !== open) && !ev.target.closest('.swipe-act')) closeOpen();
  }, {passive:true});
  document.addEventListener('touchmove', ev => {
    clearTimeout(lpTimer);
    const t0 = ev.touches[0], dx = t0.clientX - sx, dy = t0.clientY - sy;
    if (!mode) { if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; mode = row && Math.abs(dx) > Math.abs(dy) * 1.2 ? 'row' : 'scroll'; if (mode === 'row') wrap.classList.add('drag'); }
    if (mode === 'row') { const w = wrap.querySelector('.swipe-act').offsetWidth, base = open === wrap ? -w : 0; row.style.transform = 'translateX(' + Math.max(-w - 30, Math.min(0, base + dx)) + 'px)'; }
  }, {passive:true});
  document.addEventListener('touchend', ev => {
    clearTimeout(lpTimer);
    const t0 = ev.changedTouches[0], dx = t0.clientX - sx;
    if (mode === 'row' && wrap) {
      wrap.classList.remove('drag'); const w = wrap.querySelector('.swipe-act').offsetWidth, base = open === wrap ? -w : 0;
      if (base + dx < -w / 2) { if (open && open !== wrap) closeOpen(); row.style.transform = 'translateX(' + (-w) + 'px)'; open = wrap; } else { row.style.transform = ''; if (open === wrap) open = null; }
    }
    mode = null;
  }, {passive:true});
  // Klick nach Wischen oder langem Drücken unterdrücken
  document.addEventListener('click', ev => {
    if (lpFired && ev.target.closest('.tab-add')) { ev.stopPropagation(); ev.preventDefault(); lpFired = false; return; }
    if (open && ev.target.closest('.swipe > .row')) { ev.stopPropagation(); ev.preventDefault(); closeOpen(); }
  }, true);
  document.addEventListener('contextmenu', ev => { if (ev.target.closest('.tab-add')) ev.preventDefault(); });
})();

}
